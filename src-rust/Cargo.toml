[package]
name = "gerstep-script-studio-core"
version = "2.0.0"
edition = "2021"
authors = ["Gerstep Script Studio"]
description = "Motor nativo en Rust para gestión de las 11 estructuras de guion (A-K), secciones híbridas, metodologías narrativas y exportación profesional."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
